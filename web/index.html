<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<main>
    <h1>Tic Tac Toe</h1>

    <div id="mode">
        <label>
            <input
                    type="radio"
                    name="game-mode"
                    value="human_vs_human"
            >
            Player vs Player
        </label>

        <label>
            <input
                    type="radio"
                    name="game-mode"
                    value="human_vs_bot"
                    checked
            >
            Player vs Bot
        </label>
    </div>
    <p id="selected-mode"></p>
    <div id="status"></div>
    <div id="board"></div>
    <button id="reset">Reset</button>
</main>

<script type="module" src="app.js"></script>

</body>
</html>
